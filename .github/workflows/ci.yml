name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 语法检查
        run: |
          python -m py_compile server.py
      - name: 依赖检查
        run: |
          pip install --no-cache-dir -r requirements.txt
          python -c "import openpyxl, PIL, docx, pptx, fitz, pdfminer; print('核心依赖 OK')"
